<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ejercicio 6.4</title>
</head>
<body>
    <main>
        <section class="section">
            <div class="container">
                <h1>Ingresa un numero!!</h1>

            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
